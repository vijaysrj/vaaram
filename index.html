<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vaaram Family Meals</title>
<meta name="description" content="A weekly family meal planner with protein and fiber goals for everyone and a ready grocery list.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: gradient header band, tab bar, then one focused view (day / protein / groceries / family) */
:root{
  --bg:#f5f5fa;
  --surface:#ffffff;
  --surface-2:#eeeef7;
  --ink:#16152b;
  --ink-2:#5f5f7a;
  --line:#e3e3ee;
  --leaf:#4f46e5;        /* primary indigo */
  --leaf-ink:#ffffff;
  --brand-text:#3f37c9;
  --hero:linear-gradient(120deg,#312e81 0%,#5b45e0 50%,#ec6a5c 100%);
  --zari:#f59e0b;
  --turmeric:#f59e0b;
  --turmeric-soft:#fff3d6;
  --chili:#e11d48;
  --dusk:#6366f1;
  --ok:#059669;
  --warn:#d97706;
  --b:#f59e0b; --l:#10b981; --s:#f43f5e; --d:#6366f1;
  --shadow:0 1px 2px rgba(22,21,43,.05),0 12px 30px -16px rgba(49,46,129,.35);
  --dotc:rgba(99,102,241,.10);
  --font-display:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e0e1a; --surface:#181829; --surface-2:#22223a; --ink:#ececf8; --ink-2:#a6a6c4; --line:#2e2e48;
  --leaf:#6366f1; --leaf-ink:#ffffff; --brand-text:#a5b4fc; --hero:linear-gradient(120deg,#1e1b4b 0%,#3b2fa6 50%,#b4485c 100%);
  --zari:#fbbf24; --turmeric:#fbbf24; --turmeric-soft:#3a2e10; --chili:#fb7185; --dusk:#a5b4fc;
  --ok:#34d399; --warn:#fbbf24; --b:#fbbf24; --l:#34d399; --s:#fb7185; --d:#a5b4fc;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7); --dotc:rgba(165,180,252,.06); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e0e1a; --surface:#181829; --surface-2:#22223a; --ink:#ececf8; --ink-2:#a6a6c4; --line:#2e2e48;
  --leaf:#6366f1; --leaf-ink:#ffffff; --brand-text:#a5b4fc; --hero:linear-gradient(120deg,#1e1b4b 0%,#3b2fa6 50%,#b4485c 100%);
  --zari:#fbbf24; --turmeric:#fbbf24; --turmeric-soft:#3a2e10; --chili:#fb7185; --dusk:#a5b4fc;
  --ok:#34d399; --warn:#fbbf24; --b:#fbbf24; --l:#34d399; --s:#fb7185; --d:#a5b4fc;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7); --dotc:rgba(165,180,252,.06); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--leaf)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--turmeric);outline-offset:2px;border-radius:6px}
a{color:inherit}

/* Header */
.hero{background:var(--leaf);color:var(--leaf-ink);position:relative;overflow:hidden}
.hero .wrap{padding-block:22px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;z-index:1}
.brand{display:flex;gap:14px;align-items:center}
.brand h1{font-size:2.1rem;font-weight:800;letter-spacing:.01em}
.brand .ta{font-family:var(--font-display);opacity:.75;font-size:1rem;font-weight:600}
.brand p{margin:0;opacity:.82;font-size:.92rem}
.weeknav{display:flex;align-items:center;gap:6px;background:var(--leaf);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px}
.weeknav button{background:none;border:0;width:34px;height:34px;border-radius:50%;font-size:1.1rem;color:var(--leaf-ink)}
.weeknav button:hover{background:rgba(255,255,255,.14)}
.weeknav span{font-weight:600;min-width:150px;text-align:center;font-size:.95rem}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--turmeric)}
.tab .count{display:inline-block;margin-left:6px;background:var(--surface-2);border-radius:999px;padding:0 7px;font-size:.78rem}
main{padding-block:20px 60px}
.view{display:grid;gap:20px}
.view>*{min-width:0}

/* Day strip */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px 7px;text-align:center;display:grid;gap:2px}
.day b{font-family:var(--font-display);font-size:1.05rem;font-weight:700}
.day small{color:var(--ink-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.day .dots{display:flex;justify-content:center;gap:3px;margin-top:2px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.day .dots i.low{background:var(--warn)}
.day[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.day[aria-pressed="true"] small{color:var(--leaf-ink);opacity:.8}

.dayhead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.dayhead h2{font-size:1.7rem}
.dayhead p{margin:0;color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.gold{background:var(--turmeric);color:#231a04;border-color:var(--turmeric)}

/* Meals: the leaf */
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;display:grid;gap:8px;align-content:start;position:relative;min-width:0}
.meal .slot{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-2)}
.meal .slot i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.meal h3{font-size:1.22rem;font-weight:700}
.meal .note{margin:0;color:var(--ink-2);font-size:.86rem}
.meal .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap}
.pchip{background:var(--turmeric-soft);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.82rem}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink-2)}
.tag.nv{border-color:var(--chili);color:var(--chili)}
.swap{background:none;border:1px dashed var(--line);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.swap:hover{border-style:solid;color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:1.15rem;margin-bottom:10px}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.split{grid-template-columns:1fr}}

.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
@media (max-width:460px){.who{grid-template-columns:repeat(3,minmax(0,1fr))}}
.person{display:grid;justify-items:center;gap:2px;text-align:center}
.person b{font-size:.86rem}
.person small{color:var(--ink-2);font-size:.75rem}
.ring{width:64px;height:64px}
.ring text{font-family:var(--font-body);font-weight:700;fill:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;gap:10px;align-items:baseline}
.list li .k{font-weight:700;min-width:62px}
.list li .v{color:var(--ink-2);flex:1}
.prep li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--turmeric);align-self:center}

/* Week table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.85rem}
th,td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-weight:700;color:var(--ink-2);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
td.cell{cursor:pointer}
td.cell:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.today-col{background:var(--surface-2)}

/* Protein */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.pcard header{display:flex;justify-content:space-between;gap:10px;align-items:start}
.pcard h3{font-size:1.25rem}
.pcard .meta{color:var(--ink-2);font-size:.82rem}
.big{font-family:var(--font-display);font-size:1.9rem;font-weight:800;line-height:1}
.big small{font-size:.9rem;color:var(--ink-2);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px;position:relative;padding-top:6px}
.bars .bar{background:var(--l);border-radius:5px 5px 2px 2px;position:relative;min-height:3px}
.bars .bar.low{background:var(--warn)}
.bars .tl{position:absolute;left:0;right:0;border-top:2px dashed var(--ink-2);opacity:.6}
.blabels{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:.7rem;color:var(--ink-2);text-align:center}
.basis{font-size:.82rem;color:var(--ink-2);margin:0}

/* Groceries */
.cats{columns:2 340px;column-gap:16px}
.cat{break-inside:avoid;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cat h3{font-size:1.05rem;padding:12px 14px 8px;display:flex;justify-content:space-between}
.cat h3 small{font-family:var(--font-body);color:var(--ink-2);font-weight:500;font-size:.8rem}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.item input{width:20px;height:20px;accent-color:var(--leaf)}
.item .nm{font-weight:600}
.item .q{font-size:.8rem;color:var(--ink-2)}
.item.done .nm{text-decoration:line-through;opacity:.55}
.item.done .q{opacity:.55}
/* Dish builder */
.builder{display:grid;gap:14px}
.ingrows{display:grid;gap:8px}
.ingrow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:end}
.ingrow .other{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 130px 130px;gap:8px}
@media (max-width:560px){.ingrow .other{grid-template-columns:1fr 1fr}.ingrow .other .field:first-child{grid-column:1/-1}}
.ingrow .pv{font-size:.78rem;color:var(--ink-2);grid-column:1/-1;margin-top:-4px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;font-size:1.1rem;color:var(--ink-2)}
.x:hover{color:var(--chili);border-color:var(--chili)}
.unitwrap{position:relative}
.unitwrap span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.8rem;color:var(--ink-2);pointer-events:none}
.unitwrap input{padding-right:38px;-moz-appearance:textfield;appearance:textfield}
.unitwrap input::-webkit-inner-spin-button,.unitwrap input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.tally{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--turmeric-soft);border-radius:12px;padding:12px 14px}
.tally .big{font-size:2.2rem}
.tally .who2{display:flex;gap:12px;flex-wrap:wrap;font-size:.84rem}
.mine{display:grid;gap:10px}
.mydish{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.mydish h3{font-size:1.1rem}
.mydish .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:end;align-items:center}
.mydish select{font:inherit;font-size:.84rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
@media (max-width:560px){.mydish{grid-template-columns:1fr}.mydish .acts{justify-content:start}.ingrow{grid-template-columns:minmax(0,1fr) 96px auto}}
.tops{display:grid;gap:12px}
.top{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.top:last-child{border-bottom:0;padding-bottom:0}
.tophead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tophead .ok{color:var(--ok);font-weight:700}.tophead .low{color:var(--warn);font-weight:700}
.toprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.toprow.fixed{font-size:.88rem;color:var(--ink-2)}
.toprow select{font:inherit;font-size:.88rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%;min-width:0}
.toprow .x{width:34px;height:34px}
.top .linkbtn{justify-self:start;padding-left:0}
.linkbtn{background:none;border:0;padding:4px 6px;font:inherit;font-size:.85rem;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
#printView{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  :root{padding:0!important}
  body{background:#fff!important;color:#111!important;font-size:9.5pt}
  body::before,.hero,.tabs,main,.toast{display:none!important}
  #printView{display:block}
  .pp header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2pt solid #4f46e5;margin-bottom:6pt;padding-bottom:3pt}
  .pp h1{font-family:var(--font-display);font-size:18pt;color:#4f46e5;margin:0}.pp h1 span{font-size:11pt;color:#555}
  .pp header p{margin:0;color:#444}
  .pt{width:100%;min-width:0;border-collapse:collapse;font-size:8.5pt;table-layout:fixed}
  .pt th,.pt td{border:.5pt solid #bbb;padding:2.5pt 4pt;vertical-align:top;color:#111}
  .pt thead th{background:#eef3ea;font-size:8pt;text-transform:uppercase;letter-spacing:.04em}
  .pt th small,.pt td small{display:block;color:#777;font-size:7pt;font-weight:400;text-transform:none;letter-spacing:0}
  .pt tbody th{width:7%;font-family:var(--font-display);font-size:11pt;background:#f6f8f3}
  .pt td.tu{font-size:7.5pt;width:17%}.pt td.pr{font-size:7pt;width:16%}
  .pt td.pr div{display:flex;justify-content:space-between;gap:4pt}
  .pt tr{break-inside:avoid}
  .pfoot{font-size:7pt;color:#666;margin:4pt 0 0}
  .pb{break-before:page}
  .pcols{columns:4;column-gap:12pt}
  .pcat{break-inside:avoid;margin-bottom:8pt}
  .pcat h2{font-family:var(--font-display);font-size:11pt;color:#4f46e5;margin:0 0 3pt;border-bottom:.5pt solid #bbb}
  .pi{display:grid;grid-template-columns:9pt 1fr auto;gap:4pt;align-items:center;padding:1.5pt 0;font-size:8.5pt}
  .pi .bx{width:8pt;height:8pt;border:.8pt solid #333;border-radius:1.5pt}
  .pi em{font-style:normal;color:#555;font-size:7.5pt}
}
.measure{margin:0;font-size:.84rem;font-weight:600;color:var(--brand-text);display:flex;gap:6px;align-items:baseline}
.measure::before{content:"";flex:none;width:12px;height:7px;border:1.6px solid currentColor;border-top:0;border-radius:0 0 8px 8px;transform:translateY(-1px)}
.measure:empty{display:none}
.libtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.libtools input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;flex:1;min-width:200px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.libd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.libd.off{opacity:.55}
.libd h4{margin:0;font-family:var(--font-display);font-size:1.05rem;line-height:1.2}
.libd .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--ink-2)}
.libd .ings{font-size:.8rem;color:var(--ink-2)}
.libd .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.libd .acts select{font:inherit;font-size:.8rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 8px}
.libd .acts .btn{padding:4px 10px;font-size:.8rem}
.mytag{font-size:.72rem;border:1px solid var(--turmeric);color:var(--ink);border-radius:999px;padding:1px 8px}
.pantry{display:flex;flex-wrap:wrap;gap:6px}
.pantry button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem}
.pantry button[aria-pressed="true"]{background:var(--turmeric-soft);border-color:var(--turmeric);font-weight:700}
.callout{background:var(--turmeric-soft);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.callout p{margin:0}
.im-steps{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.im-steps span{padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--ink-2)}
.im-steps span.on{background:var(--leaf);color:var(--leaf-ink)}
.im-step{border:1px solid var(--leaf);background:var(--surface);color:var(--leaf);border-radius:999px;padding:3px 10px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.im-step:hover{background:var(--leaf);color:var(--leaf-ink)}
.linkbtn{background:none;border:0;padding:4px 6px;font:inherit;font-size:.85rem;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.bar2{height:8px;border-radius:999px;background:var(--surface);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--leaf);transition:width .2s}
.item.sel{background:var(--turmeric-soft)}
.pick .x{width:32px;height:32px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.picks{display:grid;gap:6px;max-height:520px;overflow:auto;background:var(--surface);border-radius:10px;padding:8px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.6fr) 64px;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick select,.pick input[type=number],.im-sel{font:inherit;font-size:.84rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.pick .nm{font-weight:600;font-size:.88rem}
.pick .miss{font-size:.82rem;color:var(--chili)}
@media (max-width:620px){.pick{grid-template-columns:auto minmax(0,1fr) 64px}.pick .opt{grid-column:2/-1}}
.bill{background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:.88rem}
.bill div{display:flex;justify-content:space-between;gap:10px}
.bill .tot{font-weight:800;font-size:1rem;border-top:1px solid var(--line);padding-top:6px}
.err{color:var(--chili);font-weight:600}
code{background:var(--surface);padding:1px 6px;border-radius:6px;font-size:.85em;user-select:all}

const prot=ing=>Object.entries(ing).reduce((a,[k,q])=>{const i=ING[k];return a+(i[2]==='pc'?q*i[3]:q*i[3]/100)},0);
function prep(d){d.p=prot(d.ing);d.f=fib(d.ing);d.main=null;let best=0;for(const [k,q] of Object.entries(d.ing)){const v=prot({[k]:q});if(v>best){best=v;d.main=k}}return d}
DISHES.forEach(prep);
// Bring the family's own dishes and ingredients into the shared tables
function syncCustom(){
  for(const k of Object.keys(ING)) if(!BASE_ING.includes(k)) delete ING[k];
  for(const [k,v] of Object.entries(S.customIng||{})) ING[k]=v;
  DISHES.splice(BUILTIN);
  for(const k of Object.keys(BYID)) if(k.startsWith('c')) delete BYID[k];
  for(const c of S.custom||[]){const d=prep({...c,ing:{...c.ing},spicy:false,mine:true});DISHES.push(d);BYID[d.id]=d}
}

 {id:'p5',name:'Son',age:4,sex:'m',weight:16,activity:'active',eggs:false,milk:true},

// Suggested protein goal, portion size and top-up style from age, sex, weight and activity
function suggest(p){
  const a=+p.age||30,w=+p.weight||0,m=p.sex==='m';
  let target,basis,mult,boost;
  if(a<4){target=12.5;basis='ICMR-NIN 2020 recommended intake for children aged 1 to 3.';mult=.35;boost='kid'}
  else if(a<7){target=16;basis='ICMR-NIN 2020 recommended intake for children aged 4 to 6.';mult=.45;boost='kid'}
  else if(a<10){target=23;basis='ICMR-NIN 2020 recommended intake for children aged 7 to 9.';mult=.6;boost='kid'}
  else if(a<13){target=32;basis=`ICMR-NIN 2020 recommended intake for ${m?'boys':'girls'} aged 10 to 12.`;mult=.75;boost='kid'}
  else if(a<16){target=m?45:44;basis=`ICMR-NIN 2020 recommended intake for ${m?'boys':'girls'} aged 13 to 15.`;mult=m?1:.9;boost='other'}
  else if(a<18){target=m?55:46;basis=`ICMR-NIN 2020 recommended intake for ${m?'boys':'girls'} aged 16 to 17.`;mult=m?1.15:.95;boost='other'}
  else{const act=ACTIVITY[p.activity]||ACTIVITY.active;let f=act[1];
    if(a>=60&&f<1.1){f=1.1;basis='1.0 to 1.2 g per kg is advised after 60 to protect muscle.'}
    else if(p.activity==='gym')basis='1.6 g per kg of body weight, the usual range for building muscle with strength training.';
    else if(p.activity==='light')basis='0.83 g per kg, the ICMR-NIN 2020 adult recommendation.';
    else basis='About 1 g per kg, a little above the ICMR-NIN 0.83 g/kg minimum for active adults.';
    target=Math.round((w||(m?65:55))*f);if(!w)basis+=` Assumes ${m?65:55} kg; add a weight for a better number.`;
    mult=a>=60?.85:(m?1.2:1);if(p.activity==='gym')mult+=.15;boost=p.activity==='gym'?'adult':'other'}
  return {target:Math.round(target),basis,mult:Math.round(mult*100)/100,boost};
}

// Fiber goal: US IOM adequate intake (14 g per 1000 kcal), by age and sex
function fiberGoal(p){const a=+p.age||30,m=p.sex==='m';
  const g=a<4?14:a<7?18:a<9?22:a<14?(m?31:26):a<19?(m?38:26):a<=50?(m?38:25):(m?30:21);
  return {g,basis:`Fiber goal ${g} g a day, the adequate intake for ${a<18?'this age':m?'men':'women'}${a>50&&a>=18?' over 50':''} (about 14 g per 1000 kcal).`}}
const fgoal=p=>+p.ftarget>0?+p.ftarget:fiberGoal(p).g;

function monday(offset){
  const t=new Date();t.setHours(0,0,0,0);
  const dow=(t.getDay()+6)%7; // Mon=0
  const m=new Date(t);m.setDate(t.getDate()-dow+(dow===0?0:7)+offset*7);
  return m;
}
const keyOf=d=>d.toISOString().slice(0,10);
const fmt=(d,o)=>d.toLocaleDateString('en-IN',o);

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const allowed=d=>!(S.hidden||[]).includes(d.id)&&(d.diet==='veg'||(d.diet==='egg'&&S.set.eggs)||(d.diet==='nonveg'&&S.set.nonveg>0));

function genPlan(seed){
  const r=rng(seed);
  const pool=s=>{const ok=DISHES.filter(d=>d.slot===s&&!(S.hidden||[]).includes(d.id)&&(d.diet==='veg'||(d.diet==='egg'&&S.set.eggs)));return shuffle(ok.length?ok:DISHES.filter(d=>d.slot===s&&d.diet==='veg'),r)};
  const P={b:pool('b'),l:pool('l'),s:pool('s'),d:pool('d')};
  // egg breakfasts read better on weekends: push them later in the order
  P.b.sort((a,b)=>(a.diet==='egg')-(b.diet==='egg'));
  const plan=DAYN.map((_,i)=>({b:P.b[i%P.b.length].id,l:P.l[i%P.l.length].id,s:P.s[i%P.s.length].id,d:P.d[i%P.d.length].id}));
  if(S.set.eggs){ // move an egg breakfast onto Saturday/Sunday if one landed on a weekday
    const eggB=P.b.filter(d=>d.diet==='egg').map(d=>d.id);
    eggB.slice(0,2).forEach((id,k)=>{plan[5+k].b=id});
  }
  const nv=Math.min(S.set.nonveg,7);
  if(nv>0){
    const days=shuffle([0,1,2,3,4,5,6],r).slice(0,nv);
    const nl=shuffle(DISHES.filter(d=>d.slot==='l'&&d.diet==='nonveg'),r), nd=shuffle(DISHES.filter(d=>d.slot==='d'&&d.diet==='nonveg'),r);
    days.forEach((day,k)=>{ if(k%2===0) plan[day].l=nl[(k/2)%nl.length].id; else plan[day].d=nd[((k-1)/2)%nd.length].id; });
  }
  // avoid the same main protein at lunch and dinner on one day
  for(let i=0;i<7;i++){ if(BYID[plan[i].l].main===BYID[plan[i].d].main){ const j=(i+3)%7; [plan[i].d,plan[j].d]=[plan[j].d,plan[i].d]; } }
  return plan;
}
function week(){
  const k=keyOf(monday(S.week));
  if(!S.weeks[k]) S.weeks[k]={plan:genPlan(hash(k)),checked:{}};
  const w=S.weeks[k];
  w.plan.forEach(day=>SLOTS.forEach(([s])=>{if(!BYID[day[s]]){const alt=DISHES.find(d=>d.slot===s&&d.diet==='veg');day[s]=alt.id}}));
  return w;
}

/* ---------- Protein maths ---------- */
function extras(person,dayIdx){
  const out=[];
  if(person.eggs&&dayIdx<5) out.push({n:'2 eggs + 4 egg whites (weekday routine)',p:2*6.3+4*3.6,f:0,ing:S.set.vEggsInList?{egg:6}:{} ,fixed:true});
  if(person.milk) out.push({n:'Morning glass of milk, 200 ml',p:6.4,f:0,ing:{milk:200},fixed:true});
  return out;
}
function dayProtein(plan,i){
  const day=plan[i];
  const meals=SLOTS.reduce((a,[s])=>a+BYID[day[s]].p,0), mealsF=SLOTS.reduce((a,[s])=>a+BYID[day[s]].f,0);
  return S.people.map(p=>{
    let total=meals*p.mult, fiber=mealsF*p.mult; const items=[], fg=fgoal(p);
    for(const e of extras(p,i)){total+=e.p;fiber+=e.f||0;items.push(e)}
    const add=t=>{total+=t.p;fiber+=t.f;items.push({id:t.id,n:t.n,p:t.p,f:t.f,ing:t.ing,pick:true})};
    const ov=((week().topups||{})[i]||{})[p.id];
    if(ov){for(const id of ov){const t=TOPBY[id];if(t)add(t)}}
    else{const list=BOOSTS[p.boost]||BOOSTS.other; let k=0;
      while(total<p.target*0.95&&k<list.length){const t=TOPBY[list[k++].id];if(t)add(t)}
      const fl=FBOOSTS[p.boost]||FBOOSTS.other; k=0;
      const fcap=p.boost==='kid'?2:3;
      while(fiber<fg*0.9&&k<Math.min(fcap,fl.length)){const t=TOPBY[fl[k++]];if(t)add(t)}}
    return {person:p,meals:meals*p.mult,total,fiber,fgoal:fg,fok:fiber>=fg*0.9,items,ok:total>=p.target*0.95,custom:!!ov};
  });
}

/* ---------- Groceries ---------- */
function groceries(){
  const w=week(),plan=w.plan, fam=S.people.reduce((a,p)=>a+p.mult,0), need={};
  const add=(ing,m)=>{for(const [k,q] of Object.entries(ing)) need[k]=(need[k]||0)+q*m};
  plan.forEach((day,i)=>{ SLOTS.forEach(([s])=>add(BYID[day[s]].ing,fam)); dayProtein(plan,i).forEach(r=>r.items.forEach(it=>add(it.ing,1))); });
  const items=Object.entries(need).filter(([,q])=>q>0).map(([k,q])=>{
    const [name,cat,unit,,pack,search]=ING[k]; const packs=unit==='pc'?Math.ceil(q/pack-0.001):Math.ceil(q/pack-0.08);
    return {k,name,cat,unit,need:q,pack,packs:Math.max(1,packs),search};
  });
  S.pantry.forEach(n=>items.push({k:'pantry:'+n,name:n,cat:'Pantry top-ups',unit:'',need:0,pack:0,packs:1,search:n.toLowerCase()}));
  return items;
}
const qty=(q,unit)=>unit==='pc'?`${Math.ceil(q)}`:unit==='ml'?(q>=1000?`${(q/1000).toFixed(1).replace(/\.0$/,'')} L`:`${Math.round(q/50)*50} ml`):(q>=1000?`${(q/1000).toFixed(1).replace(/\.0$/,'')} kg`:`${Math.max(10,Math.round(q/10)*10)} g`);
function buyLabel(it){
  if(!it.unit) return 'Check pantry';
  if(it.unit==='pc'){ if(it.k==='coconut') return `${it.packs} coconut${it.packs>1?'s':''}`; const n=it.packs*it.pack; return it.k==='egg'?`${n} eggs`:`${Math.ceil(it.need)} pcs`; }
  const packL=qty(it.pack,it.unit);
  return `${it.packs} × ${packL}`;
}

/* ---------- Kitchen measures (one adult portion, from raw weights) ---------- */
function frac(x){const w=Math.floor(x+1e-9),r=x-w;const f=r<.125?'':r<.375?'¼':r<.625?'½':r<.875?'¾':'';const W=r>=.875?w+1:w;return (W?W:'')+(f&&W?f:f)||'0'}
function plural(n,one,many){return n===1?one:many}
const MEASURE={b3:'2 ragi dosas · 2 tbsp chutney · 1 small katori curd',b4:'2 adais · 1 katori avial',d22:'2 adais · 1 katori avial',b7:'1 cup pongal · 2 tbsp chutney',
 b23:'1 cup pongal · ½ katori sambar',s5:'1 glass ragi malt',s7:'1 handful makhana · 1 glass buttermilk',s12:'2 vadas · 1 tbsp chutney',d24:'2 ragi dosas · ¾ katori soya kurma',
 d32:'2 millet dosas · 100 g fish (2 pieces)',b21:'2 kambu dosas · 2 tbsp chutney',d9:'¾ cup rice · 1 big bowl curd · ¾ katori sundal',s20:'1 glass buttermilk · 1 handful dalia',
 s26:'1 egg bonda',s25:'3 dhokla pieces',b20:'1 glass ragi kanji',s14:'1 chikki bar · ¾ glass milk',l5:'1 cup jeera rice · 60 g paneer (~8 cubes) · 1 small katori curd',
 l7:'1 cup lemon rice · ¾ katori sundal · 1 small katori curd',l15:'1 cup puliyogare · 1 katori curd',l29:'1 cup jeera rice · 2 eggs · 1 small katori curd',
 l14:'1 cup biryani · ½ katori soya · 1 small katori raita',l30:'1 cup biryani · 110 g chicken (5–6 pieces) · 1 small katori raita',l25:'1 cup pulao · 60 g paneer (~8 cubes) · 1 small katori raita',
 l6:'1½ cups bisi bele bath · 1 small katori raita',l28:'1½ cups bisi bele bath · 1 small katori raita',l26:'1 cup lemon rice · 1 katori rajma salad',l22:'1 cup curd rice · 1 tbsp paruppu podi',
 s17:'1 katori Greek yogurt · 1 banana',s8:'1 banana · 1 handful almonds · 1 glass milk',s4:'1 handful (40 g)',s18:'1 handful (40 g)'};
function measureOf(d){
  if(MEASURE[d.id])return MEASURE[d.id];
  const g=k=>d.ing[k]||0, nm=d.n.toLowerCase(), out=[];
  const has=re=>re.test(nm);
  const batter=g('idli_rice')+g('urad')+g('poha')*(g('idli_rice')?1:0)+(g('idli_rice')?g('ragi')+g('kambu'):0)+(g('millet')&&g('urad')?g('millet'):0);
  let usedRagi=g('idli_rice')>0, usedKambu=g('idli_rice')>0, usedMillet=g('millet')&&g('urad');
  // Batter-based
  if(batter){
    if(has(/vada/)&&has(/idli/)){out.push('2 idlis + 1 vada')}
    else if(has(/idli/)){out.push(`${Math.round(batter/20)} idlis`)}
    else if(has(/paniyaram/)){out.push(`${Math.round(batter/8)} paniyarams`)}
    else if(has(/uttapam/)){out.push(`${Math.max(1,Math.round(batter/45))} uttapam${Math.round(batter/45)>1?'s':''}`)}
    else if(has(/set dosa/)){out.push(`${Math.round(batter/30)} set dosas`)}
    else if(has(/dosa/)){const n=Math.max(1,Math.round(batter/40));out.push(`${n} ${plural(n,'dosa','dosas')}`)}
    else out.push(`${Math.round(batter/20)} idlis`);
  } else if(g('urad')>=25&&has(/vada/)){out.push(`${Math.round(g('urad')/15)} vadas`)}
  // Wheat
  if(g('atta')){const a=g('atta');
    if(has(/paratha/))out.push(`${Math.round(a/60)||1} paratha`);
    else if(has(/poori/))out.push(`${Math.round(a/20)} pooris`);
    else if(has(/dosa/)&&!batter)out.push(`${Math.round(a/30)} wheat dosas`);
    else out.push(`${Math.round(a/35)} chapatis`)}
  if(g('jowar'))out.push(`${Math.round(g('jowar')/35)} jowar rotis`);
  if(g('bread'))out.push(`${g('bread')} bread slices`);
  // Ragi / millets
  if(g('ragi')&&!usedRagi){const r=g('ragi');
    if(has(/mudde/))out.push('1 ragi ball (fist size)');else if(has(/malt|kanji|cookies/))out.push(has(/cookies/)?'2 ragi cookies':'1 glass');
    else if(has(/puttu/))out.push('1 cup puttu');else if(has(/dosa/)){const n=Math.max(1,Math.round((r+g('urad'))/32));out.push(`${n} ragi dosas`)}else out.push(`${r} g ragi`)}
  if(g('kambu')&&!usedKambu){if(has(/dosa/))out.push(`${Math.round((g('kambu')+g('idli_rice')+g('urad'))/35)} kambu dosas`);else out.push('1 cup kambu sadam')}
  // Rice-type grains
  const rice=g('rice')+g('kerala_rice')+g('brown_rice')+g('quinoa')+(usedMillet?0:g('millet'));
  if(rice&&!batter){
    if(has(/appam/))out.push(`${Math.max(2,Math.round(g('rice')/25))} appams`);
    else if(has(/pesarattu|adai/)){/* rice is part of the dosa batter */}
    else if(has(/upma/)&&g('millet'))out.push('1 plate upma');
    else out.push(`${frac(rice/75)} cup cooked ${has(/biryani|pulao|bisi|puliyogare|lemon|jeera|pongal|curd rice|thayir/)?'':'rice'}`.trim().replace(/cup cooked$/,'cup'))}
  if(g('rice_flour')&&!g('rava')){if(has(/idiyappam/))out.push(`${Math.round(g('rice_flour')/20)} idiyappams`);else if(has(/kozhukattai/))out.push(`${Math.round(g('rice_flour')/10)} kozhukattais`)}
  if(g('rava')||g('poha')&&!batter||g('vermicelli')||g('oats')||g('wheat_rava')){
    if(has(/rava dosa/))out.push(`${Math.round((g('rava')+g('rice_flour'))/35)} rava dosas`);
    else if(has(/idli/)&&g('oats'))out.push(`${Math.round((g('oats')+g('rava'))/14)} oats idlis`);
    else out.push('1 plate (about 1½ cups)')}
  if(g('besan')){if(has(/chilla/))out.push(`${Math.round(g('besan')/25)} chillas`);else if(has(/dhokla/))out.push('3 dhokla pieces');else if(has(/bonda/)){}}
  // Pesarattu / adai from legumes
  if(has(/pesarattu/))out.push(`${Math.round(g('green_gram')/25)||1} pesarattu`);
  if(has(/adai/)){const n=Math.round((g('rice')+g('toor')+g('chana_dal')+g('urad')+g('moong'))/40);out.push(`${n} adais`)}
  // Dal / gravy
  const dal=has(/adai|pesarattu|pongal/)?0:g('toor')+g('moong')+g('masoor')+(has(/usili/)?0:g('chana_dal')>=20?g('chana_dal'):0);
  if(dal>=10){const k=dal/30;const label=has(/sambar|bisi/)?'sambar':has(/rasam/)&&dal<20?'rasam':has(/kootu/)?'kootu':has(/saaru/)?'saaru':'dal';
    out.push(label==='rasam'?'1 cup rasam':`${frac(Math.max(.5,k))} katori ${label}`)}
  if(has(/pongal/))out.push('1 cup pongal');
  if(has(/usili/))out.push('1 katori usili');
  // Legumes cooked
  const leg=g('kabuli')+g('black_chana')+g('rajma')+g('horsegram')+g('cowpea')+(has(/pesarattu/)?0:g('green_gram'))+g('sprouts_pack')*.4;
  if(leg){const k=leg/35;out.push(`${frac(Math.max(.5,k))} katori ${has(/sundal/)?'sundal':has(/sprout|chaat|salad/)?'sprouts':has(/rasam/)?'kollu rasam':'curry'}`)}
  if(g('soya'))out.push(`${frac(Math.max(.25,g('soya')/40))} katori soya`);
  if(g('tofu'))out.push(`${g('tofu')} g tofu (½ block)`);
  if(g('paneer'))out.push(`${g('paneer')} g paneer (~${Math.round(g('paneer')/8)} cubes)`);
  if(g('mushroom'))out.push('1 katori mushroom');
  const meat=g('chicken')+g('mutton')+g('fish')+g('prawns')+g('sardine')+g('crab');
  if(meat)out.push(`${meat} g ${g('fish')||g('sardine')?'fish (2 pieces)':g('prawns')?'prawns (~8)':g('mutton')?'mutton (5–6 pieces)':'chicken (5–6 pieces)'}`);
  if(g('egg')){const e=g('egg');out.push(e===1?'1 egg':e<1?'½ egg':`${frac(e)} eggs`)}
  // Veg side
  const veg=['potato','carrot','beans','cabbage','brinjal','okra','spinach','capsicum','cauliflower','beetroot','bottle_gourd','pumpkin','sweet_potato','corn','ash_gourd','snake_gourd','chow_chow','broad_beans','colocasia','peas'].reduce((a,k)=>a+g(k),0);
  if(veg>=60&&!has(/sundal|chaat/))out.push(`${frac(Math.min(1.5,Math.max(.5,veg/90)))} katori ${has(/kurma|stew|sagu/)?'kurma':has(/masala/)&&g('potato')?'potato masala':has(/kootu/)&&!dal?'kootu':'vegetables'}`);
  else if(has(/corn/))out.push('1 cup');
  // Chutney / nuts
  const chut=(g('peanut')<=15?g('peanut'):0)+(g('roasted_chana')<=20?g('roasted_chana'):0);
  if(chut&&has(/chutney|idli|dosa|uttapam|pongal|vada|paniyaram|kozhukattai/))out.push(`${Math.max(1,Math.round(chut/7))} tbsp chutney`);
  else if(g('peanut')+g('roasted_chana')+g('almond')+g('walnut')+g('makhana')>=15)out.push('1 handful');
  // Dairy
  const curd=g('curd')+g('greek_yogurt')+g('hung_curd');
  if(curd>=30){out.push(curd>=180?'1 big bowl curd':curd>=130?'1 katori curd':curd>=80?'1 small katori curd':'2 tbsp curd')}
  if(g('milk'))out.push(`${g('milk')>=200?'1 glass':'¾ glass'} milk`);
  if(g('buttermilk'))out.push('1 glass buttermilk');
  if(g('banana'))out.push(`${g('banana')} banana`);
  if(g('dates'))out.push('3 dates');
  return [...new Set(out)].filter(Boolean).slice(0,5).join(' · ');
}

var SYNC={on:false,rev:0,last:'',timer:null,busy:false,retry:null};
const SYNC_KEYS=['people','set','weeks','custom','customIng','hidden','pantry'];
const pickSync=()=>{const o={};SYNC_KEYS.forEach(k=>o[k]=S[k]);return o};
function syncLabel(t,cls){const el=$('#syncState');if(el){el.textContent=t;el.className=cls||''}}
function applyRemote(doc){
  const ui={tab:S.tab,week:S.week,day:S.day};
  S=Object.assign(load(JSON.parse(JSON.stringify({...S,...doc.data}))),ui);
  SYNC.rev=doc.rev;SYNC.last=JSON.stringify(pickSync());

async function syncStart(){
  if(!CAN_PRINT||(location.protocol!=='https:'&&location.hostname!=='localhost'))return;
  let r;try{r=await fetch('/api/state',{cache:'no-store'})}catch(e){return}
  if(r.status===401){location.href='/login.html';return}
  if(r.status===404)return; // not the Vaaram server
  $('#acct').hidden=false;
  if(!r.ok){syncLabel(r.status===503?'Saved on this phone only':'Offline · saved on this phone','warn');return}
  let doc;try{doc=await r.json()}catch(e){return}
  SYNC.on=true;
  if(doc&&doc.data){applyRemote(doc);syncLabel('Synced','ok')}else pushNow();
  setInterval(pull,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
}
async function pull(){
  if(!SYNC.on||SYNC.busy||SYNC.timer||document.hidden)return;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  try{const r=await fetch('/api/state',{cache:'no-store'});
    if(r.status===401){location.href='/login.html';return}
    if(!r.ok)return;const doc=await r.json();
    if(doc.data&&doc.rev>SYNC.rev){applyRemote(doc);toast('Updated with the latest changes')}}catch(e){}
}
function queuePush(){
  const now=JSON.stringify(pickSync());if(now===SYNC.last)return;
  clearTimeout(SYNC.timer);syncLabel('Saving…','');SYNC.timer=setTimeout(pushNow,900);
}
async function pushNow(){
  SYNC.timer=null;const body=pickSync(),txt=JSON.stringify(body);SYNC.busy=true;
  try{const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:body})});
    if(r.status===401){location.href='/login.html';return}
    if(!r.ok)throw new Error('save failed');
    const j=await r.json();SYNC.rev=j.rev;SYNC.last=txt;syncLabel('Saved','ok')}
  catch(e){syncLabel('Not saved yet · retrying','warn');clearTimeout(SYNC.retry);SYNC.retry=setTimeout(queuePush,15000)}
  finally{SYNC.busy=false}
}

syncCustom();fromHash();render();syncStart();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
